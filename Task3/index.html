<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta property="og:type" content="website"> 
    <meta property="og:title" content="Student Management System | Frontend Project">
    <meta property="og:description" content="A responsive professional Student Management System dashboard built using HTML, CSS, and JavaScript">
    <title>Student Management System(Task 4)</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <nav class="navbar">
        <div class="logo">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                <path d="M12 2L2 7L12 12L22 7L12 2Z" fill="#3b82f6"/>
                <path d="M2 17L12 22L22 17M2 12L12 17L22 12" stroke="#3b82f6" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
            <span>Student Management System</span>
        </div>
    </nav>

    <main class="dashboard-container">
        <section class="card form-section">
            <h2 class="section-title">REGISTER NEW STUDENT</h2>
            <form id="addStudentForm" class="form-grid">
                <div class="form-group">
                    <label>Full Name</label>
                    <input type="text" id="name" required placeholder="John Doe">
                </div>
                <div class="form-group">
                    <label>Student ID</label>
                    <input type="text" id="studentId" required placeholder="STU-2024-001">
                </div>
                <div class="form-group">
                    <label>Department</label>
                    <select id="department" required>
                        <option value="Computer Science">Computer Science</option>
                        <option value="Software Engineering">Software Engineering</option>
                        <option value="Data Science">Data Science</option>
                        <option value="Information Technology">Information Technology</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>Percentage (%)</label>
                    <input type="number" id="percentage" min="0" max="100" required placeholder="0-100">
                </div>
                <div class="form-group button-group">
                    <button type="submit" class="btn-primary">+ Add Student</button>
                </div>
            </form>
        </section>

        <section class="search-section">
            <svg class="search-icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
            <input type="text" id="searchInput" placeholder="Search student by name, ID or department...">
        </section>

        <section class="card list-section">
            <div class="list-header-grid">
                <div>STUDENT INFO</div>
                <div>IDENTITY & DEPARTMENT</div>
                <div>PERCENTAGE</div>
                <div style="text-align: right;">STATUS & ACTIONS</div>
            </div>
            
            <div class="student-list-container" id="studentList">
            
            </div>

            <div class="list-footer">
                Showing <strong id="visibleCount" style="color: var(--text-primary)">0</strong> of <strong id="totalCount" style="color: var(--text-primary)">0</strong> students
            </div>
        </section>
    </main>

    <script src="script.js"></script>
</body>
</html>
